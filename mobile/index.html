<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MusicHub Mobile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #1DB954;
            --accent-shadow: rgba(29, 185, 84, 0.15);
            --accent-dim: rgba(29, 185, 84, 0.15);
            --bg: #0a0a0a;
            --card: #141414;
            --text: #fff;
            --text-secondary: #999;
        }

        html, body {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            transition: background 0.5s;
            touch-action: manipulation;
        }

        img { -webkit-user-drag: none; }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 16px 20px;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-btn:active { transform: scale(0.85); }

        .icon-btn svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
            transition: fill 0.3s;
        }

        .header { text-align: center; padding: 2px 0; flex-shrink: 0; }
        .header .status { font-size: 11px; color: #666; letter-spacing: 1px; }
        .header .service { font-size: 10px; color: var(--accent); transition: color 0.3s; }

        .artwork-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px 0;
            flex-shrink: 0;
            position: relative;
            overflow: visible;
        }

        .artwork {
            width: 260px;
            height: 260px;
            max-width: 70vmin;
            max-height: 70vmin;
            border-radius: 20px;
            background: #1a1a1a;
            object-fit: cover;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            transition: all 0.5s;
            pointer-events: none;
        }

        .artwork.placeholder {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 70px;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
        }

        .artwork.placeholder::after { content: '🎵'; }

        .track-info { text-align: center; padding: 4px 0; flex-shrink: 0; }

        .track-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 2px;
            transition: color 0.3s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 15px;
            color: #aaa;
            transition: color 0.3s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            padding: 8px 0;
            flex-shrink: 0;
        }

        .controls .icon-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            padding: 12px;
        }

        .controls .icon-btn svg { width: 24px; height: 24px; }

        .controls .play-btn {
            width: 72px;
            height: 72px;
            background: var(--accent);
            padding: 18px;
            box-shadow: 0 0 30px var(--accent-shadow);
            transition: background 0.3s, box-shadow 0.3s;
        }

        .controls .play-btn svg { width: 32px; height: 32px; fill: #000; }

        .controls .play-btn.playing {
            box-shadow: 0 0 40px var(--accent-glow-strong, rgba(29, 185, 84, 0.3));
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 0;
            flex-shrink: 0;
        }

        .volume-icon {
            font-size: 18px;
            color: #666;
            transition: color 0.3s;
            flex-shrink: 0;
        }

        .volume-slider {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: #333;
            border-radius: 3px;
            outline: none;
            transition: background 0.3s;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--thumb-color, var(--accent));
            cursor: pointer;
            transition: background 0.3s, transform 0.15s;
            box-shadow: 0 0 12px var(--thumb-shadow, rgba(29, 185, 84, 0.2));
        }

        .volume-slider::-webkit-slider-thumb:active { transform: scale(1.1); }

        .volume-percent {
            font-size: 12px;
            color: #666;
            min-width: 36px;
            text-align: right;
            transition: color 0.3s;
            flex-shrink: 0;
        }

        .footer { text-align: center; padding: 2px 0; flex-shrink: 0; }
        .footer .ip { font-size: 11px; color: #444; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .artwork.playing { animation: pulse 2s ease-in-out infinite; }

        .progress-container { width: 100%; padding: 8px 0; flex-shrink: 0; }

.progress-bar {
    width: 100%;
    height: 4px;
    background: #333;
    border-radius: 2px;
    position: relative;
    cursor: pointer;
    touch-action: none;
    /* визуально чуть выше для удобства */
}

.progress-bar::before {
    /* зона тапа побольше, визуально не меняет */
    content: '';
    position: absolute;
    inset: -12px 0;
}

.progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    border-radius: 2px;
    transition: background 0.3s ease;
    /* width анимируем только когда не тащим — иначе лагает */
}


/* === Кружок === */
.progress-thumb {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    transform: translate(-50%, -50%) scale(0.85);
    box-shadow: 0 0 10px var(--accent-shadow);
    pointer-events: none;            /* тапы ловит сам bar */
    transition: transform 0.15s ease, box-shadow 0.3s ease, background 0.3s ease;
    opacity: 0;                      /* спрятан по умолчанию */
}

.progress-bar:hover .progress-thumb,
.progress-bar.dragging .progress-thumb,
.progress-bar.playing .progress-thumb {
    opacity: 1;
}

.progress-bar.dragging .progress-thumb {
    transform: translate(-50%, -50%) scale(1.25);
    box-shadow: 0 0 16px var(--accent-shadow);
}

@media (hover: none) {
    .progress-thumb { opacity: 1; }
}

        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }

        /* === Тап-зоны по краям (невидимые) === */
        .seek-tap-zone {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 18vw;
            max-width: 120px;
            z-index: 40;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            /* не перекрываем центр — там кнопки */
            pointer-events: auto;
        }

        .seek-tap-left  { left: 0; }
        .seek-tap-right { right: 0; }

        /* === Вспышка по краю === */
        .seek-overlay {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 26vw;
            max-width: 180px;
            pointer-events: none;
            opacity: 0;
            z-index: 39;
            transition: opacity 0.3s ease;
        }

        .seek-overlay.left {
            left: 0;
            background: linear-gradient(to right,
                rgba(255,255,255,0.10) 0%,
                rgba(255,255,255,0.03) 60%,
                transparent 100%);
        }

        .seek-overlay.right {
            right: 0;
            background: linear-gradient(to left,
                rgba(255,255,255,0.10) 0%,
                rgba(255,255,255,0.03) 60%,
                transparent 100%);
        }

        .seek-overlay.show { opacity: 1; }

        .seek-overlay-label {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            font-weight: 600;
            color: rgba(255,255,255,0.75);
            letter-spacing: 0.5px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.5);
        }

        .seek-overlay.left  .seek-overlay-label { left: 14px; }
        .seek-overlay.right .seek-overlay-label { right: 14px; }

        /* === Landscape === */
        @media (orientation: landscape) and (max-height: 500px),
               (orientation: landscape) and (max-width: 800px) {
            .container {
                flex-direction: row;
                max-width: 100%;
                padding: 16px 24px;
                gap: 20px;
                align-items: center;
                justify-content: center;
            }
            .artwork-container {
                flex: 0 0 auto;
                padding: 0;
                height: 100%;
            }
            .artwork {
                width: 72vmin;
                height: 72vmin;
                max-width: 85vmin;
                max-height: 85vmin;
                min-width: 100px;
                min-height: 100px;
            }
            .right-panel {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 6px;
                min-width: 0;
                height: 100%;
                padding: 4px 0;
                max-width: 500px;
            }
            .header { text-align: center; padding: 0; }
            .header .status { font-size: 10px; }
            .header .service { font-size: 9px; }
            .track-info { text-align: center; padding: 2px 0; width: 100%; }
            .track-title {
                font-size: 16px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .track-artist {
                font-size: 12px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .controls { padding: 4px 0; gap: 20px; }
            .controls .icon-btn { width: 44px; height: 44px; padding: 10px; }
            .controls .icon-btn svg { width: 20px; height: 20px; }
            .controls .play-btn { width: 60px; height: 60px; padding: 14px; }
            .controls .play-btn svg { width: 28px; height: 28px; }
            .volume-container {
                flex-direction: row;
                gap: 12px;
                padding: 2px 0;
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
            .volume-icon { font-size: 16px; }
            .volume-slider { flex: 1; height: 6px; max-width: 200px; }
            .volume-percent { font-size: 11px; min-width: 32px; }
            .footer { text-align: center; padding: 0; }
            .footer .ip { font-size: 10px; }
        }

        @media (max-width: 380px) {
            .artwork { width: 200px; height: 200px; }
            .controls .icon-btn { width: 44px; height: 44px; padding: 10px; }
            .controls .icon-btn svg { width: 20px; height: 20px; }
            .controls .play-btn { width: 60px; height: 60px; padding: 14px; }
            .controls .play-btn svg { width: 28px; height: 28px; }
            .track-title { font-size: 17px; }
            .track-artist { font-size: 13px; }
        }

        @media (max-width: 380px) and (orientation: landscape) {
            .artwork { width: 25vmin; height: 25vmin; min-width: 80px; min-height: 80px; }
            .controls .icon-btn { width: 38px; height: 38px; padding: 8px; }
            .controls .icon-btn svg { width: 18px; height: 18px; }
            .controls .play-btn { width: 50px; height: 50px; padding: 12px; }
            .controls .play-btn svg { width: 24px; height: 24px; }
            .track-title { font-size: 14px; }
            .track-artist { font-size: 11px; }
        }

        @media (min-width: 600px) and (orientation: portrait) {
            .artwork { width: 340px; height: 340px; }
            .track-title { font-size: 28px; }
            .track-artist { font-size: 20px; }
            .controls .icon-btn { width: 64px; height: 64px; padding: 16px; }
            .controls .icon-btn svg { width: 30px; height: 30px; }
            .controls .play-btn { width: 88px; height: 88px; padding: 22px; }
            .controls .play-btn svg { width: 40px; height: 40px; }
        }

        @media (min-width: 800px) and (orientation: landscape) {
            .artwork { width: 38vmin; height: 38vmin; }
            .track-title { font-size: 22px; }
            .track-artist { font-size: 16px; }
            .controls .icon-btn { width: 52px; height: 52px; padding: 12px; }
            .controls .icon-btn svg { width: 24px; height: 24px; }
            .controls .play-btn { width: 68px; height: 68px; padding: 16px; }
            .controls .play-btn svg { width: 32px; height: 32px; }
        }
    </style>
</head>
<body>
    <div class="seek-tap-zone seek-tap-left"  id="seekTapLeft"></div>
    <div class="seek-tap-zone seek-tap-right" id="seekTapRight"></div>

    <div class="seek-overlay" id="seekOverlay">
        <span class="seek-overlay-label" id="seekOverlayLabel"></span>
    </div>

    <div class="container" id="app">
        <div class="artwork-container">
            <img id="artwork" class="artwork placeholder" src="" alt="Обложка">
        </div>
        <div class="right-panel">
            <div class="header">
                <div class="status">🎵 MusicHub Mobile</div>
                <div class="service" id="service">—</div>
            </div>

            <div class="track-info">
                <div class="track-title" id="title">—</div>
                <div class="track-artist" id="artist">—</div>
            </div>

            <div class="controls">
                <button id="prevBtn" class="icon-btn" aria-label="Предыдущий">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button id="playBtn" class="icon-btn play-btn" aria-label="Воспроизвести">
                    <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button id="nextBtn" class="icon-btn" aria-label="Следующий">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>

            <div class="volume-container">
                <span class="volume-icon" id="volumeIcon">🔊</span>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="50">
                <span class="volume-percent" id="volumePercent">50%</span>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                    <div class="progress-thumb" id="progressThumb"></div>
                </div>
                <div class="progress-time">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>

            <div class="footer">
                <div class="ip" id="ipDisplay">Подключение...</div>
            </div>
        </div>
    </div>

    <script>
// === КОНСТАНТЫ ===
const STORAGE_KEY = 'musichub_mobile_track_data';
const DOUBLE_TAP_WINDOW = 300;
const ACCUMULATE_WINDOW = 600;
const SEEK_STEP = 10;
const SERVICE_NAMES = {
    'yandex': 'Яндекс Музыка',
    'youtube': 'YouTube Music',
    'soundcloud': 'SoundCloud',
    'spotify': 'Spotify',
    'vk': 'VK Music'
};

// === СОСТОЯНИЕ ===
let ws = null;
let isConnected = false;
let currentVolume = 50;
let isPlayingState = false;
let currentAccentColor = '#1DB954';

let seeking = false;
let seekPreviewSec = 0;
let durationSec = 0;
let currentSec = 0;

let lastTapTime = 0;
let lastTapSide = null;
let pendingSeekMs = 0;
let flushTimer = null;
let overlayHideTimer = null;

let lastTrackData = {
    title: '—',
    artist: '—',
    artwork: '',
    service: '',
    accentColor: '#1DB954',
    isPlaying: false
};

// === DOM ===
const artwork = document.getElementById('artwork');
const title = document.getElementById('title');
const artist = document.getElementById('artist');
const service = document.getElementById('service');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const volumeSlider = document.getElementById('volumeSlider');
const volumePercent = document.getElementById('volumePercent');
const volumeIcon = document.getElementById('volumeIcon');
const ipDisplay = document.getElementById('ipDisplay');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');

const seekTapLeft = document.getElementById('seekTapLeft');
const seekTapRight = document.getElementById('seekTapRight');
const seekOverlay = document.getElementById('seekOverlay');
const seekOverlayLabel = document.getElementById('seekOverlayLabel');

const progressThumb = document.getElementById('progressThumb');

// === УТИЛИТЫ ===
function hexToRgba(hex, alpha) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    if (!result) return `rgba(29, 185, 84, ${alpha})`;
    const r = parseInt(result[1], 16);
    const g = parseInt(result[2], 16);
    const b = parseInt(result[3], 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function fmtTime(sec) {
    const s = Math.max(0, Math.floor(sec));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return `${m}:${String(r).padStart(2, '0')}`;
}

function isValidString(v) {
    return v && v !== 'null' && v !== 'undefined' && v !== '' && v !== '—' && v !== '-';
}

function isValidArtwork(v) {
    return v && v !== '' && v !== 'null' && v !== 'undefined' && !v.startsWith('file://');
}

// === СОХРАНЕНИЕ / ЗАГРУЗКА ===
function saveTrackData() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            title: lastTrackData.title,
            artist: lastTrackData.artist,
            artwork: lastTrackData.artwork,
            service: lastTrackData.service,
            accentColor: lastTrackData.accentColor
        }));
    } catch (e) {
        console.warn('⚠️ Ошибка сохранения:', e);
    }
}

function loadSavedTrackData() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return false;
        const data = JSON.parse(saved);

        if (isValidString(data.title)) {
            lastTrackData.title = data.title;
            title.textContent = data.title;
        }
        if (isValidString(data.artist)) {
            lastTrackData.artist = data.artist;
            artist.textContent = data.artist;
        }
        if (isValidArtwork(data.artwork)) {
            lastTrackData.artwork = data.artwork;
            artwork.src = data.artwork;
            artwork.classList.remove('placeholder');
            artwork.style.display = 'block';
        }
        if (data.service) {
            lastTrackData.service = data.service;
            service.textContent = SERVICE_NAMES[data.service] || data.service;
        }
        if (data.accentColor) {
            lastTrackData.accentColor = data.accentColor;
            currentAccentColor = data.accentColor;
            applyAccentColor(data.accentColor);
        }
        console.log('💾 Загружены сохранённые данные:', data.title, '-', data.artist);
        return true;
    } catch (e) {
        console.warn('⚠️ Ошибка загрузки:', e);
        return false;
    }
}

// === АКЦЕНТНЫЙ ЦВЕТ ===
function applyAccentColor(color) {
    if (!color) return;
    currentAccentColor = color;
    lastTrackData.accentColor = color;

    document.documentElement.style.setProperty('--accent', color);
    document.documentElement.style.setProperty('--accent-shadow', hexToRgba(color, 0.15));

    // кнопка play
    playBtn.style.background = color;
    const rgbaStrong = hexToRgba(color, 0.3);
    const rgbaLight = hexToRgba(color, 0.15);
    playBtn.style.boxShadow = isPlayingState
        ? `0 0 40px ${rgbaStrong}`
        : `0 0 30px ${rgbaLight}`;

    // слайдер громкости
    volumeSlider.style.setProperty('--thumb-color', color);
    volumeSlider.style.setProperty('--thumb-shadow', rgbaLight);

    // прогресс
    progressFill.style.background = color;
    progressThumb.style.background = color;
    progressThumb.style.boxShadow = `0 0 10px ${rgbaLight}`;

    // название сервиса
    service.style.color = color;

    // фон страницы
    document.body.style.background = '#0a0a0a';
    document.body.style.backgroundImage =
        `radial-gradient(circle at 50% 0%, ${color}22 0%, transparent 70%)`;
}

// === ПОДКЛЮЧЕНИЕ ===
function connect() {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/ws`;

    ipDisplay.textContent = '⏳ Подключение...';
    ipDisplay.style.color = '#ffaa00';
    ipDisplay.style.opacity = '1';

    try {
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            console.log('✅ Подключено к MusicHub');
            isConnected = true;

            ipDisplay.textContent = '✅ Подключено';
            ipDisplay.style.color = '#1DB954';
            ipDisplay.style.transition = 'opacity 0.5s';

            setTimeout(() => {
                ipDisplay.style.opacity = '0';
                setTimeout(() => {
                    ipDisplay.textContent = '';
                    ipDisplay.style.opacity = '1';
                }, 500);
            }, 2000);

            sendSyncRequest();
            ws.send(JSON.stringify({ command: 'get_accent_color' }));
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'status') {
                    updateUI(data.data);
                } else if (data.type === 'track_progress') {
                    updateProgressOnly(data);
                } else if (data.type === 'track_changed') {
                    updateTrackOnly(data.data);
                } else if (data.type === 'accent_color') {
                    if (data.color) {
                        applyAccentColor(data.color);
                        saveTrackData();
                    }
                }
            } catch (e) {
                console.error('Ошибка парсинга WS:', e);
            }
        };

        ws.onclose = () => {
            isConnected = false;
            ipDisplay.textContent = '🔴 Отключено';
            ipDisplay.style.color = '#ff4444';
            ipDisplay.style.opacity = '1';
            setTimeout(connect, 3000);
        };

        ws.onerror = () => {};
    } catch (e) {
        ipDisplay.textContent = '⚠️ Ошибка';
        ipDisplay.style.color = '#ff4444';
        setTimeout(connect, 5000);
    }
}

function sendSyncRequest() {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ command: 'sync_status' }));
    }
}

// === ПРОГРЕСС ===
function rememberProgress(sec, dur) {
    currentSec = sec || 0;
    if (dur > 0) durationSec = dur;
}

function renderProgress(sec, dur) {
    const cur = Math.max(0, sec);
    const total = dur > 0 ? dur : durationSec;
    currentTimeEl.textContent = fmtTime(cur);
    totalTimeEl.textContent = fmtTime(total);

    const pct = total > 0 ? Math.min(100, (cur / total) * 100) : 0;
    progressFill.style.width = `${pct}%`;
    progressThumb.style.left = `${pct}%`;   // ← двигаем кружок
}

function updateProgressOnly(data) {
    const sec = data.progress || 0;
    const dur = data.duration || 0;
    rememberProgress(sec, dur);
    if (!seeking) renderProgress(sec, dur);
}

// === ОБНОВЛЕНИЕ ТРЕКА ===
function updateTrackOnly(data) {
    if (isValidString(data.title)) {
        lastTrackData.title = data.title;
        title.textContent = data.title;
    } else if (isValidString(lastTrackData.title)) {
        title.textContent = lastTrackData.title;
    }

    if (isValidString(data.artist)) {
        lastTrackData.artist = data.artist;
        artist.textContent = data.artist;
    } else if (isValidString(lastTrackData.artist)) {
        artist.textContent = lastTrackData.artist;
    }

    if (data.service) {
        lastTrackData.service = data.service;
        service.textContent = SERVICE_NAMES[data.service] || data.service;
    }

    if (data.accentColor) {
        applyAccentColor(data.accentColor);
    }

    if (data.isPlaying !== undefined && data.isPlaying !== null) {
        lastTrackData.isPlaying = data.isPlaying;
        updatePlayButton(data.isPlaying);
    }

    // сброс прогресса (сервер пришлёт актуальный)
    durationSec = 0;
    currentSec = 0;
    progressFill.style.width = '0%';
    currentTimeEl.textContent = '0:00';
    totalTimeEl.textContent = '0:00';

    saveTrackData();
}

// === ПОЛНОЕ ОБНОВЛЕНИЕ UI ===
function updateUI(data) {
    if (isValidString(data.title)) {
        lastTrackData.title = data.title;
        title.textContent = data.title;
    } else if (isValidString(lastTrackData.title)) {
        title.textContent = lastTrackData.title;
    }

    if (isValidString(data.artist)) {
        lastTrackData.artist = data.artist;
        artist.textContent = data.artist;
    } else if (isValidString(lastTrackData.artist)) {
        artist.textContent = lastTrackData.artist;
    }

    if (data.artwork !== undefined) {
        if (isValidArtwork(data.artwork)) {
            lastTrackData.artwork = data.artwork;
            const target = new URL(data.artwork, location.href).href;
            if (artwork.src !== target) artwork.src = data.artwork;
            artwork.classList.remove('placeholder');
            artwork.style.display = 'block';
        } else if (!lastTrackData.artwork) {
            artwork.src = '';
            artwork.classList.add('placeholder');
            artwork.style.display = 'flex';
        }
    }

    if (data.service) {
        lastTrackData.service = data.service;
        service.textContent = SERVICE_NAMES[data.service] || data.service;
    }

    if (data.accentColor) {
        applyAccentColor(data.accentColor);
    }

    if (data.isPlaying !== undefined && data.isPlaying !== null) {
        lastTrackData.isPlaying = data.isPlaying;
        updatePlayButton(data.isPlaying);
    }

    if (data.volume !== undefined && data.volume !== null) {
        let vol = Math.round(data.volume * 100);
        vol = Math.max(1, Math.min(100, vol));
        if (Math.abs(vol - currentVolume) > 0.5) {
            currentVolume = vol;
            volumeSlider.value = vol;
            volumePercent.textContent = `${vol}%`;
            updateVolumeIcon(vol);
        }
    }

    if (data.progress !== undefined) {
        updateProgressOnly(data);
    }

    saveTrackData();
}

// === PLAY BUTTON ===
function updatePlayButton(playing) {
    isPlayingState = playing;
    progressBar.classList.toggle('playing', playing);
    if (playing) {
        playBtn.classList.add('playing');
        artwork.classList.add('playing');
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        playBtn.setAttribute('aria-label', 'Пауза');
        playBtn.style.boxShadow = `0 0 40px ${hexToRgba(currentAccentColor, 0.3)}`;
    } else {
        playBtn.classList.remove('playing');
        artwork.classList.remove('playing');
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        playBtn.setAttribute('aria-label', 'Воспроизвести');
        playBtn.style.boxShadow = `0 0 30px ${hexToRgba(currentAccentColor, 0.15)}`;
    }
}

function updateVolumeIcon(vol) {
    if (vol <= 1) volumeIcon.textContent = '🔇';
    else if (vol < 30) volumeIcon.textContent = '🔈';
    else if (vol < 70) volumeIcon.textContent = '🔉';
    else volumeIcon.textContent = '🔊';
}

// === SEEK OVERLAY ===
function showSeekOverlay(side, totalSec) {
    const label = (side === 'left' ? '−' : '+') + Math.abs(totalSec);
    seekOverlayLabel.textContent = label;
    seekOverlay.classList.remove('left', 'right');
    seekOverlay.classList.add(side);
    seekOverlay.classList.remove('show');
    void seekOverlay.offsetWidth;
    seekOverlay.classList.add('show');

    clearTimeout(overlayHideTimer);
    overlayHideTimer = setTimeout(() => {
        seekOverlay.classList.remove('show');
    }, 450);
}

// === ДВОЙНОЙ ТАП ПО КРАЯМ ===
function handleSideTap(side) {
    if (!durationSec) return;
    const now = Date.now();

    if (now - lastTapTime > DOUBLE_TAP_WINDOW) {
        lastTapTime = now;
        lastTapSide = side;
        return;
    }

    if (side !== lastTapSide) {
        lastTapTime = 0;
        lastTapSide = null;
        pendingSeekMs = 0;
        return;
    }

    const stepMs = (side === 'left' ? -1 : 1) * SEEK_STEP * 1000;
    if (pendingSeekMs !== 0 && Math.sign(pendingSeekMs) === Math.sign(stepMs)) {
        pendingSeekMs += stepMs;
    } else {
        flushPendingSeek();
        pendingSeekMs = stepMs;
    }

    showSeekOverlay(side, pendingSeekMs / 1000);

    lastTapTime = 0;
    lastTapSide = null;

    clearTimeout(flushTimer);
    flushTimer = setTimeout(flushPendingSeek, ACCUMULATE_WINDOW);
}

// pointerdown — надёжнее, чем pointerup (не ловит скролл)
seekTapLeft.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleSideTap('left');
});
seekTapRight.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleSideTap('right');
});

// защита от зума
[seekTapLeft, seekTapRight].forEach(el => {
    el.addEventListener('dblclick', (e) => e.preventDefault());
});

// === SEEK ОТПРАВКА ===
function sendSeek(sec) {
    const dur = durationSec;
    const position = Math.max(0, Math.min(dur > 0 ? dur : sec, sec));
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ command: 'seek', position }));
    } else {
        sendCommand('/api/seek', { position });
    }
    seekPreviewSec = position;
    currentSec = position;
    renderProgress(position, dur);
}

function sendSeekBy(delta) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ command: 'seek_by', delta }));
    } else {
        const base = currentSec ?? seekPreviewSec ?? 0;
        sendCommand('/api/seek', { position: Math.max(0, base + delta) });
    }
    const base = currentSec ?? seekPreviewSec ?? 0;
    seekPreviewSec = Math.max(0, Math.min(durationSec || Infinity, base + delta));
    currentSec = seekPreviewSec;
    renderProgress(seekPreviewSec, durationSec);
}

function flushPendingSeek() {
    if (!pendingSeekMs) return;
    const delta = pendingSeekMs / 1000;
    pendingSeekMs = 0;
    console.log(`📱 Двойной тап: ${delta > 0 ? '+' : ''}${delta} сек`);
    sendSeekBy(delta);
}

// === PROGRESS BAR: тап / drag ===
progressBar.addEventListener('pointerdown', (e) => {
    if (!durationSec) return;
    seeking = true;
    progressBar.classList.add('dragging');   // ←
    progressBar.setPointerCapture(e.pointerId);
    const rect = progressBar.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    seekPreviewSec = frac * durationSec;
    renderProgress(seekPreviewSec, durationSec);
});

progressBar.addEventListener('pointermove', (e) => {
    if (!seeking || !durationSec) return;
    const rect = progressBar.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    seekPreviewSec = frac * durationSec;
    renderProgress(seekPreviewSec, durationSec);
});

// pointerup ловим на window — надёжнее при capture
window.addEventListener('pointerup', (e) => {
    if (!seeking) return;
    seeking = false;
    progressBar.classList.remove('dragging');
    if (!durationSec) return;
    const rect = progressBar.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    sendSeek(frac * durationSec);
});

window.addEventListener('pointercancel', () => {
    if (!seeking) return;
    seeking = false;
    progressBar.classList.remove('dragging');
    renderProgress(currentSec, durationSec);
});

// === КОМАНДЫ ===
async function sendCommand(endpoint, data = {}) {
    try {
        const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        return await response.json();
    } catch (e) {
        console.error('Ошибка команды:', e);
    }
}

// === ОБРАБОТЧИКИ КНОПОК ===
playBtn.addEventListener('click', () => {
    sendCommand('/api/play');
    updatePlayButton(!isPlayingState);
});

prevBtn.addEventListener('click', () => sendCommand('/api/prev'));
nextBtn.addEventListener('click', () => sendCommand('/api/next'));

volumeSlider.addEventListener('input', (e) => {
    let vol = parseInt(e.target.value, 10);
    if (vol < 1) { vol = 1; e.target.value = 1; }
    currentVolume = vol;
    volumePercent.textContent = `${vol}%`;
    updateVolumeIcon(vol);
    sendCommand('/api/volume', { volume: vol / 100 });
});

// === ЗАЩИТА ===
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('dragstart', (e) => e.preventDefault());
document.addEventListener('selectstart', (e) => {
    if (!e.target.closest('input, textarea')) e.preventDefault();
});
document.body.addEventListener('touchstart', (e) => {
    if (e.target.tagName === 'IMG') e.preventDefault();
}, { passive: false });

// === СТАРТ ===
loadSavedTrackData();
connect();

// подстраховка, если WS ещё не подключился
setTimeout(() => {
    fetch('/api/status')
        .then(res => res.json())
        .then(data => {
            if (data && data.title && data.title !== '—') updateUI(data);
        })
        .catch(() => {});
}, 1000);

setTimeout(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
        sendSyncRequest();
    } else {
        fetch('/api/status')
            .then(res => res.json())
            .then(data => {
                if (data && data.title && data.title !== '—') updateUI(data);
            })
            .catch(() => {});
    }
}, 3000);

console.log('📱 MusicHub Mobile v4.2 (clean) загружен');
    </script>
