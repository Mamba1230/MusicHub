<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MusicHub overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    :root {
        --accent: #1DB954;
        --s: 1;
    }

    html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        color: #fff;
    }

    #card {
        position: absolute;
        left: calc(24px * var(--s));
        bottom: calc(24px * var(--s));
        display: flex;
        align-items: center;
        gap: calc(16px * var(--s));
        padding: calc(14px * var(--s)) calc(26px * var(--s)) calc(14px * var(--s)) calc(14px * var(--s));
        border-radius: calc(24px * var(--s));
        overflow: hidden;
        background: #121214;
        box-shadow: 0 calc(10px * var(--s)) calc(30px * var(--s)) rgba(0, 0, 0, 0.45);
        opacity: 0;
        transform: translateY(calc(12px * var(--s)));
        transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    #card.visible { opacity: 1; transform: none; }

    /* Размытая обложка как фон карточки */
    #bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        filter: blur(26px) saturate(1.5);
        transform: scale(1.5);
        opacity: 0.55;
        transition: background-image 0.4s ease;
    }
    #shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(10, 10, 12, 0.35), rgba(10, 10, 12, 0.7));
    }

    #cover, #meta { position: relative; }

    #cover {
        width: calc(88px * var(--s));
        height: calc(88px * var(--s));
        flex: none;
        border-radius: calc(16px * var(--s));
        background: rgba(255, 255, 255, 0.08) center / cover no-repeat;
        box-shadow: 0 calc(6px * var(--s)) calc(18px * var(--s)) rgba(0, 0, 0, 0.45);
        transition: opacity 0.3s ease, filter 0.3s ease;
    }
    #cover.empty::after {
        content: "♪";
        display: grid;
        place-items: center;
        height: 100%;
        font-size: calc(34px * var(--s));
        color: rgba(255, 255, 255, 0.45);
    }
    #card.paused #cover { opacity: 0.6; filter: grayscale(0.5); }

    #meta {
        min-width: 0;
        max-width: calc(380px * var(--s));
        display: flex;
        flex-direction: column;
        gap: calc(4px * var(--s));
        transition: opacity 0.22s ease, transform 0.22s ease;
    }
    #meta.swap { opacity: 0; transform: translateY(calc(6px * var(--s))); }

    .line { overflow: hidden; white-space: nowrap; }
    .line > span { display: inline-block; will-change: transform; }

    #title {
        font-size: calc(22px * var(--s));
        font-weight: 700;
        line-height: 1.2;
    }
    #artistRow {
        display: flex;
        align-items: center;
        gap: calc(10px * var(--s));
    }
    #artist {
        font-size: calc(16px * var(--s));
        line-height: 1.3;
        color: rgba(255, 255, 255, 0.78);
        min-width: 0;
    }

        #prog {
        position: relative;
        height: 3px;
        margin-top: calc(6px * var(--s));
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
    }
    #progFill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: var(--accent);
        transition: width 0.25s linear;
    }

    /* Эквалайзер: движется только пока трек играет */
    #eq {
        flex: none;
        display: flex;
        align-items: flex-end;
        gap: calc(2px * var(--s));
        height: calc(14px * var(--s));
    }
    #eq i {
        display: block;
        width: calc(3px * var(--s));
        height: 30%;
        border-radius: 2px;
        background: var(--accent);
        transition: height 0.3s ease;
    }
    #card.playing #eq i { animation: eq 0.9s ease-in-out infinite alternate; }
    #card.playing #eq i:nth-child(2) { animation-delay: -0.3s; animation-duration: 0.7s; }
    #card.playing #eq i:nth-child(3) { animation-delay: -0.6s; animation-duration: 1.1s; }
    @keyframes eq { from { height: 25%; } to { height: 100%; } }

    @media (prefers-reduced-motion: reduce) {
        #card.playing #eq i { animation: none; height: 70%; }
        #card, #meta { transition: opacity 0.2s ease; transform: none; }
    }
</style>
</head>
<body>
    <div id="card">
        <div id="bg"></div>
        <div id="shade"></div>
        <div id="cover" class="empty"></div>
        <div id="meta">
            <div class="line" id="titleLine"><span id="title"></span></div>
            <div id="artistRow">
                <div id="eq"><i></i><i></i><i></i></div>
                <div class="line" id="artistLine"><span id="artist"></span></div>
            </div>
            <!-- Второй блок #artistRow удалён -->
            <div id="prog"><i id="progFill"></i></div>
        </div>
    </div>

<script>
/*
 * Параметры адреса (необязательные):
 *   ?scale=1.5     размер (0.5 – 3)
 *   ?show=8        показывать карточку N секунд после смены трека или возобновления, потом скрывать
 *   ?pos=br        угол: bl (по умолчанию), br, tl, tr
 */
(function () {
    var q = new URLSearchParams(location.search);
    var scale = Math.min(3, Math.max(0.5, parseFloat(q.get('scale')) || 1));
    var showFor = Math.max(0, parseFloat(q.get('show')) || 0) * 1000;
    var pos = (q.get('pos') || 'bl').toLowerCase();

    var root = document.documentElement;
    root.style.setProperty('--s', scale);

    var card = document.getElementById('card');
    if (pos[0] === 't') { card.style.bottom = 'auto'; card.style.top = 'calc(24px * var(--s))'; }
    if (pos[1] === 'r') { card.style.left = 'auto'; card.style.right = 'calc(24px * var(--s))'; }

    var meta = document.getElementById('meta');
    var cover = document.getElementById('cover');
    var bg = document.getElementById('bg');
    var titleEl = document.getElementById('title');
    var artistEl = document.getElementById('artist');

    var cur = { key: '', cover: '', playing: false, has: false };
    var hideTimer = null;
    var anims = [];

    // Бегущая строка для длинных названий
    function fitMarquee(span) {
        var box = span.parentElement;
        var over = span.scrollWidth - box.clientWidth;
        if (over > 4) {
            var a = span.animate(
                [{ transform: 'translateX(0)' }, { transform: 'translateX(' + (-over - 8) + 'px)' }],
                { duration: over * 45 + 3000, direction: 'alternate', iterations: Infinity, delay: 1500, easing: 'linear' }
            );
            anims.push(a);
        }
    }
    function resetMarquee() {
        anims.forEach(function (a) { a.cancel(); });
        anims = [];
    }

    // Цвет акцента из обложки (картинка с того же адреса, поэтому canvas доступен)
    function pickAccent(url) {
        var img = new Image();
        img.onload = function () {
            try {
                var c = document.createElement('canvas');
                c.width = c.height = 24;
                var ctx = c.getContext('2d');
                ctx.drawImage(img, 0, 0, 24, 24);
                var d = ctx.getImageData(0, 0, 24, 24).data;
                var r = 0, g = 0, b = 0, w = 0;
                for (var i = 0; i < d.length; i += 4) {
                    var max = Math.max(d[i], d[i + 1], d[i + 2]);
                    var min = Math.min(d[i], d[i + 1], d[i + 2]);
                    var sat = max === 0 ? 0 : (max - min) / max;
                    var wt = sat * sat * (max / 255) + 0.01;
                    r += d[i] * wt; g += d[i + 1] * wt; b += d[i + 2] * wt; w += wt;
                }
                r = r / w; g = g / w; b = b / w;
                // не даём акценту быть слишком тёмным
                var m = Math.max(r, g, b);
                if (m < 150 && m > 0) { var k = 150 / m; r *= k; g *= k; b *= k; }
                root.style.setProperty('--accent', 'rgb(' + [r, g, b].map(function (v) { return Math.min(255, Math.round(v)); }).join(',') + ')');
            } catch (e) { /* оставляем прежний */ }
        };
        img.src = url;
    }

    function setCover(url) {
        if (!url) {
            cover.style.backgroundImage = '';
            cover.classList.add('empty');
            bg.style.backgroundImage = '';
            return;
        }
        var img = new Image();
        img.onload = function () {
            if (cur.cover !== url) return;           // уже пришла более новая
            cover.style.backgroundImage = 'url("' + url + '")';
            cover.classList.remove('empty');
            bg.style.backgroundImage = 'url("' + url + '")';
            pickAccent(url);
        };
        img.src = url;
    }

    function setText(title, artist) {
        resetMarquee();
        titleEl.textContent = title;
        artistEl.textContent = artist;
        requestAnimationFrame(function () {
            fitMarquee(titleEl);
            fitMarquee(artistEl);
        });
    }

    function showCard() {
        card.classList.add('visible');
        clearTimeout(hideTimer);
        if (showFor > 0) hideTimer = setTimeout(function () { card.classList.remove('visible'); }, showFor);
    }

    function apply(s) {
        var title = s.title || '';
        var artist = s.artist || '';
        var coverUrl = s.cover || '';
        var playing = !!s.is_playing;
        var key = title + '|' + artist;

        if (!title) {
            cur = { key: '', cover: '', playing: false, has: false };
            clearTimeout(hideTimer);
            card.classList.remove('visible');
            return;
        }

        var trackChanged = key !== cur.key;
        var resumed = playing && !cur.playing;

        card.classList.toggle('playing', playing);
        card.classList.toggle('paused', !playing);

        if (coverUrl !== cur.cover) {
            cur.cover = coverUrl;
            setCover(coverUrl);
        }

        if (trackChanged) {
            cur.key = key;
            if (cur.has) {
                // единственная анимация смены: текст уходит и возвращается
                meta.classList.add('swap');
                setTimeout(function () {
                    setText(title, artist);
                    meta.classList.remove('swap');
                }, 220);
            } else {
                setText(title, artist);
            }
        }

        cur.playing = playing;
        cur.has = true;

        if (showFor === 0) card.classList.add('visible');
        else if (trackChanged || resumed) showCard();
        var dur = s.duration_ms || 0, pos = s.progress_ms || 0;
        var progFill = document.getElementById('progFill');
        if (progFill) progFill.style.width = dur > 0 ? Math.min(100, pos / dur * 100).toFixed(2) + '%' : '0%';
    }

    function connect() {
        var es = new EventSource('/overlay/events');
        es.addEventListener('state', function (e) {
            try { apply(JSON.parse(e.data)); } catch (err) { /* пропускаем битое сообщение */ }
        });
        // EventSource переподключается сам; при полном обрыве просто остаёмся на последнем кадре
    }
    connect();
})();
</script>
</body>
</html>
